# ─────────────────────────────────────────────────────────────────────────────
# TicketAI — Nginx Reverse Proxy Configuration
# Handles: static frontend, API proxying, rate limiting, WebSocket support
# ─────────────────────────────────────────────────────────────────────────────

# ─── Rate Limiting Zones ─────────────────────────────────────────────────────
# General API rate limit: 20 requests/second per IP (burst up to 50)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Auth endpoint rate limit: 5 requests/second per IP (stricter for login/register)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ─── Upstream Definitions ────────────────────────────────────────────────────
upstream backend {
    server server:5000;
    keepalive 32;
}

upstream frontend {
    server client:80;
    keepalive 16;
}

# ─── Gzip Configuration ──────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ─── Main Server Block ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Maximum allowed request body size (for file uploads etc.)
    client_max_body_size 10m;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ─── Security Headers (applied globally) ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide nginx version
    server_tokens off;

    # ─── Health Check Endpoint ───────────────────────────────────────────────
    # Used by load balancers and monitoring tools to verify the proxy is alive
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ─── API Routes → Backend ────────────────────────────────────────────────
    location /api/ {
        # Apply general API rate limiting
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for SSE / streaming responses
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Pass through response headers
        proxy_pass_header  Server;
        proxy_redirect     off;
    }

    # ─── Auth Routes → Backend (stricter rate limiting) ──────────────────────
    location ~ ^/api/auth/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_redirect     off;
    }

    # ─── All Other Routes → Frontend (React SPA) ─────────────────────────────
    location / {
        proxy_pass http://frontend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
    }

    # ─── Deny Hidden Files ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
