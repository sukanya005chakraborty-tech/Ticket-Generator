name: CD — Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: "latest"

# Only one deployment runs at a time; new pushes queue behind the current one
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ticketai-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/ticketai-frontend

jobs:
  # ─── Build & Push Docker Images ────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 8)
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${IMAGE_TAG}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            NODE_ENV=production

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=/api

  # ─── Deploy to Production Server ───────────────────────────────────────────
  deploy:
    name: Deploy to Production via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -e

            echo "==> Navigating to project directory"
            cd ${{ secrets.PRODUCTION_PATH }}

            echo "==> Setting image tag for this deployment"
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            echo "==> Pulling latest images from Docker Hub"
            docker-compose -f docker-compose.prod.yml pull

            echo "==> Bringing up services with zero-downtime rolling update"
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Waiting for services to be healthy (30s)"
            sleep 30

            echo "==> Verifying deployment health"
            docker-compose -f docker-compose.prod.yml ps

            echo "==> Pruning unused Docker resources"
            docker system prune -f

            echo "==> Deployment complete: sha-${{ github.sha }}"

      - name: Notify deployment success
        if: success()
        run: |
          echo "Successfully deployed sha-${{ github.sha }} to production"
          echo "Backend image: ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "DEPLOYMENT FAILED for sha-${{ github.sha }}"
          echo "Check the SSH step above for details"
          exit 1
