version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# TicketAI — Production Docker Compose
#
# Key differences from development:
#   - MongoDB is NOT exposed on the host network
#   - Images pulled from Docker Hub registry (not built locally)
#   - Resource limits enforced on all services
#   - Structured JSON logging for log aggregation
#   - restart: always (auto-recover from crashes)
#   - No source code bind mounts
#
# Usage:
#   docker-compose -f docker-compose.prod.yml pull
#   docker-compose -f docker-compose.prod.yml up -d --remove-orphans
#   docker-compose -f docker-compose.prod.yml logs -f --tail=100
#
# Environment:
#   Create a .env.prod file (never commit it) or export secrets via CI/CD.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ticketai-mongodb-prod
    restart: always
    # No port mapping in production — only accessible inside app-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ticketai
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet", "--username", "${MONGO_ROOT_USERNAME}", "--password", "${MONGO_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ticketai-redis-prod
    restart: always
    # No external port in production
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Backend (Node.js + Express) ───────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME:-ticketai}/ticketai-backend:${IMAGE_TAG:-latest}
    container_name: ticketai-backend-prod
    restart: always
    # No external port exposure — accessed through nginx only
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/ticketai?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLIENT_URL: ${CLIENT_URL}
      LOG_LEVEL: warn
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.75"
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ─── Frontend (React SPA served via Nginx) ─────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME:-ticketai}/ticketai-frontend:${IMAGE_TAG:-latest}
    container_name: ticketai-frontend-prod
    restart: always
    # No external port — accessed through nginx reverse proxy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Nginx (Reverse Proxy + SSL Termination) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ticketai-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment the lines below after obtaining SSL certificates via Certbot
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Certbot (SSL Certificate Management) ──────────────────────────────────
  # Uncomment this service to enable Let's Encrypt SSL certificates.
  # Steps:
  #   1. Set DOMAIN and CERTBOT_EMAIL environment variables
  #   2. Uncomment the certbot service and nginx volume mounts above
  #   3. Update nginx.conf to serve port 443 with SSL
  #   4. Run: docker-compose -f docker-compose.prod.yml run --rm certbot certonly \
  #               --webroot --webroot-path=/var/www/certbot \
  #               -d ${DOMAIN} --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email
  #
  # certbot:
  #   image: certbot/certbot
  #   container_name: ticketai-certbot
  #   volumes:
  #     - /etc/letsencrypt:/etc/letsencrypt
  #     - /var/www/certbot:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   depends_on:
  #     - nginx

# ─── Networks ──────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
